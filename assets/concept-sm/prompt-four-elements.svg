<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="772" viewBox="0 0 680 386" role="img"><rect x="0" y="0" width="680" height="386" fill="#FAF7F2"></rect><title>一個好 Prompt 的四大要素</title><desc>角色、背景、任務、格式四個要素，各附一句說明與一個染整廠情境的例子。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></marker></defs>
<text class="th" x="20" y="26" dominant-baseline="central" font-size="22" font-weight="700" fill="#1A1814" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif">一個好 Prompt 的四大要素</text>
<text class="ts" x="20" y="48" dominant-baseline="central" font-size="16" font-weight="500" fill="#1A1814" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif">四個都給，它就不用猜。少給一個，它就自己補一個。</text>
<rect class="box" x="20" y="62" width="312" height="144" rx="12" stroke-width="0.5" fill="#FFFFFF" stroke="#A89D85"></rect>
<g class="c-green">
<circle class="bar" cx="66" cy="104" r="22" fill="#2E6F40"></circle>
<text class="th inv" x="66" y="104" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="700" fill="#FFFFFF" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif">1</text>
<text class="th" x="100" y="94" dominant-baseline="central" font-size="22" font-weight="700" fill="#2E6F40" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif">角色 Role</text>
</g>
<text class="ts" x="100" y="120" dominant-baseline="central" font-size="16" font-weight="500" fill="#1A1814" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif">要它站在誰的立場回答</text>
<line x1="42" y1="150" x2="310" y2="150" stroke="#B4B2A9" stroke-width="0.8"></line>
<text class="ts en" x="42" y="176" dominant-baseline="central" font-style="italic" font-size="16" font-weight="500" fill="#7A756B" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif">例：你是染整廠資深品管主管</text>
<rect class="box" x="348" y="62" width="312" height="144" rx="12" stroke-width="0.5" fill="#FFFFFF" stroke="#A89D85"></rect>
<g class="c-green">
<circle class="bar" cx="394" cy="104" r="22" fill="#2E6F40"></circle>
<text class="th inv" x="394" y="104" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="700" fill="#FFFFFF" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif">2</text>
<text class="th" x="428" y="94" dominant-baseline="central" font-size="22" font-weight="700" fill="#2E6F40" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif">背景 Context</text>
</g>
<text class="ts" x="428" y="120" dominant-baseline="central" font-size="16" font-weight="500" fill="#1A1814" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif">它不知道的前提，你要給</text>
<line x1="370" y1="150" x2="638" y2="150" stroke="#B4B2A9" stroke-width="0.8"></line>
<text class="ts en" x="370" y="176" dominant-baseline="central" font-style="italic" font-size="16" font-weight="500" fill="#7A756B" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif">例：客戶是合作 5 年的日本商社</text>
<rect class="box" x="20" y="222" width="312" height="144" rx="12" stroke-width="0.5" fill="#FFFFFF" stroke="#A89D85"></rect>
<g class="c-green">
<circle class="bar" cx="66" cy="264" r="22" fill="#2E6F40"></circle>
<text class="th inv" x="66" y="264" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="700" fill="#FFFFFF" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif">3</text>
<text class="th" x="100" y="254" dominant-baseline="central" font-size="22" font-weight="700" fill="#2E6F40" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif">任務 Task</text>
</g>
<text class="ts" x="100" y="280" dominant-baseline="central" font-size="16" font-weight="500" fill="#1A1814" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif">做什麼，動詞要具體</text>
<line x1="42" y1="310" x2="310" y2="310" stroke="#B4B2A9" stroke-width="0.8"></line>
<text class="ts en" x="42" y="336" dominant-baseline="central" font-style="italic" font-size="16" font-weight="500" fill="#7A756B" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif">例：寫一封道歉＋說明＋補救的信</text>
<rect class="box" x="348" y="222" width="312" height="144" rx="12" stroke-width="0.5" fill="#FFFFFF" stroke="#A89D85"></rect>
<g class="c-green">
<circle class="bar" cx="394" cy="264" r="22" fill="#2E6F40"></circle>
<text class="th inv" x="394" y="264" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="700" fill="#FFFFFF" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif">4</text>
<text class="th" x="428" y="254" dominant-baseline="central" font-size="22" font-weight="700" fill="#2E6F40" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif">格式 Format</text>
</g>
<text class="ts" x="428" y="280" dominant-baseline="central" font-size="16" font-weight="500" fill="#1A1814" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif">長度、語氣、條列還是表格</text>
<line x1="370" y1="310" x2="638" y2="310" stroke="#B4B2A9" stroke-width="0.8"></line>
<text class="ts en" x="370" y="336" dominant-baseline="central" font-style="italic" font-size="16" font-weight="500" fill="#7A756B" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif">例：300 字、三段式、語氣誠懇</text>
</svg>