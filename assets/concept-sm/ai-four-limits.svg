<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 680 450" role="img"><rect x="0" y="0" width="680" height="450" fill="#FAF7F2"></rect><title>AI 的四大能力極限</title><desc>幻覺、知識斷點、推理錯覺、計算盲點四項限制，各附風險等級與實例。</desc>
